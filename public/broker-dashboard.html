<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Broker Dashboard – MyFreightTracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: #f4f6fb;
      color: #111827;
    }

    header {
      background: #0f172a;
      color: #ffffff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.2rem;
      font-weight: bold;
    }

    .logo span {
      color: #22c55e;
    }

    .header-right a {
      color: #e5e7eb;
      text-decoration: none;
      font-size: 0.9rem;
      margin-left: 16px;
    }

    main {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 16px 32px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(280px, 360px) 1fr;
      gap: 24px;
      align-items: flex-start;
    }

    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px 18px;
      box-shadow: 0 4px 14px rgba(15, 23, 42, 0.1);
    }

    .card h2 {
      font-size: 1rem;
      margin-bottom: 10px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: #374151;
    }
