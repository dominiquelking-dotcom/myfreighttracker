<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Broker Register – MyFreightTracker</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0f172a;
      color: #f9fafb;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      background: #111827;
      padding: 24px;
      border-radius: 16px;
      width: 320px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.6);
    }
    h1 {
      font-size: 1.3rem;
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px 9px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #4b5563;
      outline: none;
    }
    button {
      width: 100%;
      padding: 9px;
      border-radius: 999px;
      border: none;
      background: #22c55e;
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
    }
    p {
      font-size: 0.8rem;
      margin-top: 8px;
    }
    a {
      color: #9ca3af;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Create broker account</h1>
    <form method="POST" action="/broker-register">
      <label for="email">Email</label>
      <input id="email" name="email" type="email" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" required />

      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="/broker-login.html">Log in</a></p>
  </div>
</body>
</html>
